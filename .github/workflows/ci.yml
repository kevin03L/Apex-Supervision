# Intégration continue d'Apex Supervision : Windows et Linux.
#  - à chaque push / pull request : formatage, clippy (avertissements bloquants), tests ;
#  - sur un tag v* (ou à la demande) : installateur Windows et paquet DEB, avec empreintes
#    SHA-256 ; le paquet DEB est installé, démarré, interrogé puis purgé sur le runner.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Bibliothèques nécessaires à la compilation de l'utilitaire desktop (egui/winit) sous Linux
  LINUX_GUI_DEPS: libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

jobs:
  fmt:
    name: Formatage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_GUI_DEPS
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  package-windows:
    name: Installateur Windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [fmt, check]
    runs-on: windows-latest
    # Le contexte « secrets » est interdit dans les conditions « if » des étapes : la présence
    # des secrets de signature est évaluée ici, une fois pour tout le job.
    env:
      SIGNPATH_ACTIF: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_API_TOKEN != '' }}
      PFX_ACTIF: ${{ secrets.APEX_SIGN_PFX_BASE64 != '' && secrets.APEX_SIGN_PFX_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Compilation release des binaires
        run: cargo build --release --locked -p apex-server -p apex-admin

      # --- Option 1 : Signature par SignPath Foundation ---
      - name: Téléversement des binaires non signés (SignPath)
        if: env.SIGNPATH_ACTIF == 'true'
        id: binaires
        uses: actions/upload-artifact@v4
        with:
          name: binaires-unsigned
          path: |
            target/release/apex-scada.exe
            target/release/apex-scada-admin.exe

      - name: Requête de signature SignPath (binaires)
        if: env.SIGNPATH_ACTIF == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'apex-supervision' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: 'binaires'
          github-artifact-id: ${{ steps.binaires.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/signed-binaries

      - name: Intégration des binaires signés SignPath
        if: env.SIGNPATH_ACTIF == 'true'
        shell: pwsh
        run: |
          Get-ChildItem -Path target/signed-binaries -Recurse | Where-Object { $_.Extension -eq '.zip' } | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath target/release -Force
          }
          Get-ChildItem -Path target/signed-binaries -Recurse | Where-Object { $_.Extension -eq '.exe' } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination target/release -Force
          }

      - name: Construction de l'installateur avant signature (SignPath)
        if: env.SIGNPATH_ACTIF == 'true'
        shell: pwsh
        run: |
          ./packaging/windows/build-installer.ps1 -SkipBuild -SansSignature

      - name: Téléversement de l'installateur non signé (SignPath)
        if: env.SIGNPATH_ACTIF == 'true'
        id: installateur
        uses: actions/upload-artifact@v4
        with:
          name: installateur-unsigned
          path: dist/apex-supervision-*-windows-x64-setup.exe

      - name: Requête de signature SignPath (installateur)
        if: env.SIGNPATH_ACTIF == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'apex-supervision' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: 'installateur'
          github-artifact-id: ${{ steps.installateur.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-installer

      - name: Intégration de l'installateur signé SignPath et recalcul empreinte SHA-256
        if: env.SIGNPATH_ACTIF == 'true'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/signed-installer -Recurse | Where-Object { $_.Extension -eq '.zip' } | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath dist -Force
          }
          Get-ChildItem -Path dist/signed-installer -Recurse | Where-Object { $_.Extension -eq '.exe' } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination dist -Force
          }
          ./packaging/windows/build-installer.ps1 -RecalculerSha256

      # --- Option 2 : Signature locale PFX (certificat OV alternatif) ---
      - name: Construction avec signature locale PFX
        if: env.SIGNPATH_ACTIF != 'true' && env.PFX_ACTIF == 'true'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.APEX_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.APEX_SIGN_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "apex-signing-certificate.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $env:APEX_SIGN_PFX = $pfxPath
          $env:APEX_SIGN_PFX_PASSWORD = $env:SIGN_PFX_PASSWORD
          ./packaging/windows/build-installer.ps1 -SkipBuild -Signer

      - name: Nettoyage du certificat temporaire PFX
        if: always() && env.PFX_ACTIF == 'true'
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "apex-signing-certificate.pfx"
          if (Test-Path $pfxPath) {
            Remove-Item -Force $pfxPath
          }

      # --- Option 3 : Sans configuration SignPath ni PFX (non signé) ---
      - name: Construction non signée (secours)
        if: env.SIGNPATH_ACTIF != 'true' && env.PFX_ACTIF != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning::Aucune configuration de signature (SignPath ou PFX) : installateur NON signé"
          ./packaging/windows/build-installer.ps1 -SkipBuild -SansSignature

      - name: Publication de l'artefact Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.sha256

  package-linux:
    name: Paquet DEB (Ubuntu 22.04)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [fmt, check]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_GUI_DEPS
      - run: cargo install cargo-deb --locked
      - run: cargo build --release --locked -p apex-server -p apex-admin
      - name: Paquet
        run: |
          cargo deb -p apex-server --no-build --output dist/
          cd dist && for f in *.deb; do sha256sum "$f" > "$f.sha256"; done
      # Étape rejouée à l'identique sous Docker (Ubuntu 22.04 avec systemd) : voir REFONTE_ALPHA.md §12.2
      - name: Test d'installation, de démarrage, de mise à jour et de purge
        run: |
          set -eux
          # Attend que le moteur réponde (30 s au plus) et affiche la réponse de /api/health
          sante() {
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && return 0; sleep 1; done
            return 1
          }
          CONF=/etc/apex-supervision/apex-scada.toml
          sudo apt-get install -y ./dist/*.deb
          test -f "$CONF"
          test "$(stat -c '%a %U:%G' "$CONF")" = "660 root:apex-scada"
          getent passwd apex-scada
          sante | grep -q '"status":"ok"'
          systemctl is-active apex-scada
          sudo apex-scada config check --config "$CONF"
          # Arrêt propre (SIGTERM) consigné dans les journaux (journald peut écrire avec retard)
          sudo systemctl stop apex-scada
          ok=0
          for i in $(seq 1 10); do
            sudo journalctl -u apex-scada --no-pager | grep -q "arrêté proprement" && { ok=1; break; }
            sleep 1
          done
          test "$ok" = 1
          # Redémarrage, puis mise à jour (réinstallation) : configuration migrée, service relancé
          sudo systemctl restart apex-scada
          sante | grep -q '"status":"ok"'
          pid_avant=$(systemctl show apex-scada -p MainPID --value)
          sudo apt-get install -y --reinstall ./dist/*.deb
          sante | grep -q '"status":"ok"'
          test "$(systemctl show apex-scada -p MainPID --value)" != "$pid_avant"
          test "$(stat -c '%a %U:%G' "$CONF")" = "660 root:apex-scada"
          # remove conserve les données, purge les supprime
          sudo apt-get remove -y apex-supervision
          test -f "$CONF"
          test -d /var/lib/apex-supervision
          sudo apt-get purge -y apex-supervision
          test ! -e /etc/apex-supervision
          test ! -e /var/lib/apex-supervision
          test ! -e /var/log/apex-supervision
          test -z "$(getent passwd apex-scada)"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-deb
          path: |
            dist/*.deb
            dist/*.sha256

  release:
    name: Publication GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-windows, package-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Téléchargement des artefacts Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Téléchargement des artefacts Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64-deb
          path: dist
      - name: Archive des modules complémentaires
        run: |
          test -n "$(find packs -maxdepth 1 -name '*.json' -print -quit)"
          zip -r "dist/apex-symboles-${GITHUB_REF_NAME}.zip" packs -i 'packs/*.json' 'packs/README.md'
          cd dist && sha256sum "apex-symboles-${GITHUB_REF_NAME}.zip" > "apex-symboles-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publication de la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.deb
            dist/*.sha256
            dist/apex-symboles-*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
